            <section class="sec rise d2">
              <h2 class="label">Short answer</h2>
              <p class="answer-lead">Use <code class="ic">const</code> by default. Use <code class="ic">let</code> only when the variable needs a new value later.</p>
            </section>

            <section class="sec rise d3">
              <h2 class="label">Simple explanation</h2>
              <p class="prose">Both create a <strong>variable</strong> — a name that refers to a value. The difference is whether you can <strong>reassign</strong> it, which means pointing that name at a different value. <code class="ic">let</code> allows it; <code class="ic">const</code> doesn't.<sup><a href="#src1" style="font-size: 11px; font-weight: 600; text-decoration: none">[1]</a></sup></p>
            </section>

              <h2 class="label">Example</h2>

                  <span>javascript</span>

                  <div class="row"><span class="ln">3</span><span> </span></div>
                  <div class="row"><span class="ln">4</span><span>score = score + <span class="n">10</span>;   <span class="c">// OK: let can be reassigned</span></span></div>
                  <div class="row"><span class="ln">5</span><span>console.<span class="f">log</span>(score);   <span class="c">// 10</span></span></div>
                  <div class="row hl"><span class="ln">6</span><span>name = <span class="s">"Ali"</span>;         <span class="c">// TypeError: Assignment to constant variable.</span></span></div>
                </div>
              </div>

                <li class="row-hover" style="display: flex; gap: 14px; padding: 11px 16px; border-bottom: 1px solid var(--border)"><span class="badge mono" style="flex: none">L4</span><span>Gives <code class="ic">score</code> a new value. Allowed, because it's <code class="ic">let</code>.</span></li>

<script>window.__PROPS__ = {};</script>
<script src="preview-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false, saved: true, vote: null };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const v = this.state.vote;
    const on = 'background: var(--primary-soft); color: var(--primary-text)';
    return {
      copied: this.state.copied,
      notCopied: !this.state.copied,
      copy: () => {
        this.setState({ copied: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ copied: false }), 1800);
      },
      saved: this.state.saved,
      notSaved: !this.state.saved,
      savedCount: this.state.saved ? 6 : 5,
      toggleSave: () => this.setState({ saved: !this.state.saved }),
      upPressed: v === 'up' ? 'true' : 'false',
      downPressed: v === 'down' ? 'true' : 'false',
      upStyle: v === 'up' ? on : '',
      downStyle: v === 'down' ? on : '',
      voted: v !== null,
      voteUp: () => this.setState({ vote: v === 'up' ? null : 'up' }),
      voteDown: () => this.setState({ vote: v === 'down' ? null : 'down' })
    };
  }
}
window.__mount(Component);
</script>
